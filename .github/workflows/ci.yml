# Spec §13.7: install -> lint -> typecheck -> test -> openapi check -> build
#                    -> Playwright -> Lighthouse CI
# Playwright and Lighthouse are Fase 3, so they are not wired yet.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Corepack has to be enabled BEFORE setup-node. `cache: yarn` makes that
      # action run `yarn cache dir` to find the cache folder, and the Ubuntu image
      # ships Yarn 1, which refuses to read a package.json declaring
      # "packageManager": "yarn@4.18.1". Enabling corepack after left the action
      # failing on its own step, before corepack was ever reached.
      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  e2e:
    # Spec §14 Fase 3: the calculators have to work in a browser, and the golden
    # fixtures only prove the arithmetic. This is the job that caught the
    # hydration data loss, which no server-side check could see.
    #
    # The API is a separate repository, so it is checked out as a sibling. The
    # suite refuses to run without it: Astro fetches the parameter set at build
    # time and fails on purpose (spec §10.1).
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: olivarcalc
          MYSQL_USER: olivarcalc
          MYSQL_PASSWORD: olivarcalc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uolivarcalc -polivarcalc"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      # The API goes INSIDE this workspace, not next to it.
      #
      # `actions/checkout` refuses a path outside the workspace root — "Repository
      # path ... is not under ..." — and it is right to: a sibling checkout would
      # land outside the directory the workflow's credentials and token scoping
      # apply to. The API repo is therefore cloned into a subdirectory and the
      # E2E steps address it from there.
      - uses: actions/checkout@v5

      - name: Checkout the API
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.API_REPOSITORY }}
          path: api

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl, bcmath, gd, zip
          coverage: none

      - name: Install the API
        working-directory: api
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force
          # The calculators read a published set; without one the pages render
          # but every figure is wrong.
          php artisan parameters:publish --force

      - name: Serve the API
        working-directory: api
        run: php artisan serve --host=127.0.0.1 --port=8000 &
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: olivarcalc
          DB_USERNAME: olivarcalc
          DB_PASSWORD: olivarcalc

      # Corepack before setup-node; see the note in the quality job.
      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable

      - name: Install the browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: yarn e2e
        env:
          CI: 'true'
          API_URL: http://127.0.0.1:8000
          PUBLIC_SITE_URL: http://127.0.0.1:4321

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  openapi-in-sync:
    # Spec §3.3: the committed client must match the contract. Regenerating
    # here and failing on a diff is what catches a forgotten
    # `yarn api:generate`.
    name: OpenAPI client in sync
    runs-on: ubuntu-latest

    # Scramble reflects on the Eloquent models to build the schema, so it needs a
    # live MySQL. Without one this job failed with "SQLSTATE[HY000] [2002]
    # Connection refused" while looking like a contract problem. The database has
    # to exist too: the migrations run below, so Scramble has tables to reflect.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: olivarcalc
          MYSQL_USER: olivarcalc
          MYSQL_PASSWORD: olivarcalc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uolivarcalc -polivarcalc"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v5

      # Corepack before setup-node; see the note in the quality job.
      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable

      # This job calls PHP, so it needs PHP. It did not have it before: the step
      # below was `|| true`, which swallowed the "command not found" and made the
      # job look like it was checking the contract when it had exported nothing.
      - name: Checkout the API
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.API_REPOSITORY }}
          path: api

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, bcmath, gd, zip
          coverage: none

      - name: Install the API dependencies
        working-directory: api
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Export the contract from the API
        working-directory: api
        run: php artisan scramble:export --path=storage/app/openapi.json

      # Downloads the freshly exported contract, regenerates the client and fails
      # on a diff, so a forgotten `yarn api:generate` cannot reach main.
      - name: Regenerate the client
        run: yarn api:generate
        env:
          OPENAPI_FILE: api/storage/app/openapi.json

      - name: Fail if the committed client changed
        run: |
          if ! git diff --quiet -- packages/api-client openapi; then
            echo "::error::The generated API client is out of date."
            echo "Run 'yarn api:generate' and commit the result."
            git diff --stat -- packages/api-client openapi
            exit 1
          fi
